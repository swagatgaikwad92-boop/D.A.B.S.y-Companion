<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>D.A.B.S.y</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- The Minimal Default State: Only Atmosphere and Eyes -->
  <div id="atmosphere"></div>
  <canvas id="dabsy-canvas"></canvas>
  <div id="subtitle-box"></div>

  <!-- The Expanded World (Revealed on Double Tap) -->
  <div id="dabsy-world">
    <div class="world-content">
      <div class="panel room-panel">
        <h2>D.A.B.S.y's Space</h2>
        <div class="env-items">
          <div class="item">🪴 Study Plant</div>
          <div class="item">📚 PCMB Textbooks</div>
          <div class="item">💻 Mentorly Dashboard Code</div>
        </div>
      </div>
      <div class="panel task-panel">
        <h2>Active Focus</h2>
        <ul id="task-list">
          <li class="task">Physics Revision: Current Electricity</li>
          <li class="task">UI Layout Adjustments</li>
        </ul>
      </div>
    </div>
  </div>

  <script src="physics.js"></script>
  <script src="memory.js"></script>
  <script src="eyes.js"></script>
  <script src="behavior.js"></script>
  <script src="app.js"></script>
</body>
</html>
