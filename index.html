<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>D.A.B.S.y</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app-container">
    <!-- Minimal Default Home Screen: ONLY EYES -->
    <main id="creature-stage">
      <canvas id="eye-canvas"></canvas>
      <div id="subtitle-box" class="hidden"></div>
      <video id="webcam-feed" autoplay playsinline muted class="hidden"></video>
    </main>

    <!-- Expanded D.A.B.S.y World Modal (Opened via Double Tap) -->
    <div id="expanded-world" class="modal hidden"></div>
  </div>

  <script src="memory.js"></script>
  <script src="state.js"></script>
  <script src="brain.js"></script>
  <script src="study.js"></script>
  <script src="vision.js"></script>
  <script src="voice.js"></script>
  <script src="room.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
