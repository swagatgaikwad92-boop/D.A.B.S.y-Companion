<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>D.A.B.S.y</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #030305;
      color: #f0f0f5;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    #atmosphere {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, #071018 0%, #030305 75%);
      z-index: 0;
      transition: opacity 0.6s ease;
    }

    #dabsy-canvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 10;
      touch-action: none;
    }

    #subtitle-box {
      position: absolute;
      bottom: 14%;
      left: 50%;
      transform: translateX(-50%) translateY(15px);
      background: rgba(10, 14, 22, 0.75);
      border: 1px solid rgba(0, 242, 254, 0.15);
      padding: 12px 24px;
      border-radius: 18px;
      font-size: 15px;
      letter-spacing: 0.4px;
      text-align: center;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      opacity: 0;
      pointer-events: none;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 15;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
    }

    #subtitle-box.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Floating Option Bubbles (Revealed on Double Tap) */
    #bubble-menu {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    #bubble-menu.active {
      opacity: 1;
      pointer-events: auto;
    }

    .bubble-constellation {
      position: relative;
      width: 280px;
      height: 280px;
    }

    .action-bubble {
      position: absolute;
      background: rgba(12, 18, 28, 0.85);
      border: 1px solid rgba(0, 242, 254, 0.3);
      color: #fff;
      padding: 12px 20px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.5px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 242, 254, 0.15), inset 0 1px 0 rgba(255,255,255,0.1);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transform: scale(0);
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s;
    }

    .action-bubble:active {
      transform: scale(0.95) !important;
      background: rgba(0, 242, 254, 0.2);
    }

    #bubble-menu.active .action-bubble {
      transform: scale(1);
    }

    /* Position the floating bubbles in a constellation around the center */
    .bubble-study { top: 0%; left: 50%; transform: translate(-50%, -50%) scale(0); transition-delay: 0.05s; }
    .bubble-topics { top: 25%; left: 90%; transform: translate(-50%, -50%) scale(0); transition-delay: 0.1s; }
    .bubble-tasks { top: 75%; left: 85%; transform: translate(-50%, -50%) scale(0); transition-delay: 0.15s; }
    .bubble-settings { top: 75%; left: 15%; transform: translate(-50%, -50%) scale(0); transition-delay: 0.2s; }
    .bubble-room { top: 25%; left: 10%; transform: translate(-50%, -50%) scale(0); transition-delay: 0.25s; }

    #bubble-menu.active .bubble-study { transform: translate(-50%, -50%) scale(1); }
    #bubble-menu.active .bubble-topics { transform: translate(-50%, -50%) scale(1); }
    #bubble-menu.active .bubble-tasks { transform: translate(-50%, -50%) scale(1); }
    #bubble-menu.active .bubble-settings { transform: translate(-50%, -50%) scale(1); }
    #bubble-menu.active .bubble-room { transform: translate(-50%, -50%) scale(1); }
  </style>
</head>
<body>

  <div id="atmosphere"></div>
  <canvas id="dabsy-canvas"></canvas>
  <div id="subtitle-box"></div>

  <!-- Floating Option Bubbles Menu -->
  <div id="bubble-menu">
    <div class="bubble-constellation">
      <div class="action-bubble bubble-study" onclick="App.selectOption('Study Mode')">📚 Study Mode</div>
      <div class="action-bubble bubble-topics" onclick="App.selectOption('Topics')">📖 Topics</div>
      <div class="action-bubble bubble-tasks" onclick="App.selectOption('Tasks')">✅ Tasks</div>
      <div class="action-bubble bubble-settings" onclick="App.selectOption('Settings')">⚙️ Settings</div>
      <div class="action-bubble bubble-room" onclick="App.selectOption('D.A.B.S.y Room')">🏠 Room</div>
    </div>
  </div>

  <script>
    class Spring {
      constructor(val, tension = 130, friction = 14) {
        this.val = val;
        this.target = val;
        this.vel = 0;
        this.tension = tension;
        this.friction = friction;
      }
      update(dt = 0.016) {
        const force = (this.target - this.val) * this.tension;
        this.vel += (force - this.vel * this.friction) * dt;
        this.val += this.vel * dt;
        return this.val;
      }
    }

    class DabsyEyes {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        
        this.gazeX = new Spring(0, 110, 12);
        this.gazeY = new Spring(0, 110, 12);
        this.blink = new Spring(1, 250, 18);
        this.squash = new Spring(1, 150, 12); 
        this.bloom = new Spring(1, 90, 20); 
        
        this.resize();
        window.addEventListener('resize', () => this.resize());
      }

      resize() {
        this.canvas.width = window.innerWidth * window.devicePixelRatio;
        this.canvas.height = window.innerHeight * window.devicePixelRatio;
        this.ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      }

      render() {
        this.gazeX.update();
        this.gazeY.update();
        this.blink.update();
        this.squash.update();
        this.bloom.update();

        const w = window.innerWidth;
        const h = window.innerHeight;
        this.ctx.clearRect(0, 0, w, h);

        const cx = w / 2;
        const cy = h / 2;
        const spacing = 100;
        
        // Exact proportions from user reference: vertical rounded pill shape with specular highlight
        const eyeWidth = 48;
        const eyeHeight = 78;

        this.ctx.save();
        this.ctx.translate(cx, cy);

        [-spacing / 2, spacing / 2].forEach((offsetX, idx) => {
          this.ctx.save();
          
          const x = offsetX + this.gazeX.val;
          const y = this.gazeY.val;
          const width = eyeWidth * (2 - this.squash.val);
          const height = eyeHeight * Math.max(0.05, this.blink.val) * this.squash.val;
          
          this.ctx.translate(x, y);

          // Layer 1: Atmospheric Cyan Bloom
          this.ctx.shadowColor = `rgba(0, 242, 254, ${0.45 * this.bloom.val})`;
          this.ctx.shadowBlur = 85;
          this.ctx.fillStyle = 'rgba(0, 242, 254, 0.12)';
          this.drawPill(width, height);
          this.ctx.fill();

          // Layer 2: Luminous Cyan Pill Body
          this.ctx.shadowColor = `rgba(0, 242, 254, ${0.8 * this.bloom.val})`;
          this.ctx.shadowBlur = 25;
          this.ctx.fillStyle = '#00f2fe';
          this.drawPill(width * 0.92, height * 0.92);
          this.ctx.fill();

          // Layer 3: Cute Specular Highlight Circle (top-left inside each eye)
          this.ctx.shadowBlur = 0;
          this.ctx.fillStyle = '#ffffff';
          this.ctx.beginPath();
          const pupilOffsetX = -width * 0.22;
          const pupilOffsetY = -height * 0.25;
          this.ctx.arc(pupilOffsetX, pupilOffsetY, 6.5, 0, Math.PI * 2);
          this.ctx.fill();

          this.ctx.restore();
        });
        this.ctx.restore();
      }

      drawPill(w, h) {
        this.ctx.beginPath();
        const r = w / 2; // Fully rounded pill ends
        if (this.ctx.roundRect) {
            this.ctx.roundRect(-w/2, -h/2, w, h, r);
        } else {
            this.ctx.moveTo(-w/2 + r, -h/2);
            this.ctx.arcTo(w/2, -h/2, w/2, h/2, r);
            this.ctx.arcTo(w/2, h/2, -w/2, h/2, r);
            this.ctx.arcTo(-w/2, h/2, -w/2, -h/2, r);
            this.ctx.arcTo(-w/2, -h/2, w/2, -h/2, r);
        }
      }
    }

    class DabsyBehavior {
      constructor(eyes) {
        this.eyes = eyes;
        this.state = 'IDLE';
        this.lifeLoop();
        this.breathingLoop();
      }

      setState(newState) {
        this.state = newState;
        if (newState === 'THINKING') {
          this.eyes.squash.target = 0.85; 
          this.eyes.bloom.target = 1.35;
        } else if (newState === 'HAPPY') {
          this.eyes.squash.target = 0.7; 
          this.eyes.blink.target = 0.8;
          this.eyes.bloom.target = 1.25;
        } else if (newState === 'IDLE') {
          this.eyes.squash.target = 1;
          this.eyes.blink.target = 1;
          this.eyes.gazeX.target = 0;
          this.eyes.gazeY.target = 0;
          this.eyes.bloom.target = 1;
        }
      }

      triggerBlink() {
        this.eyes.blink.target = 0.05;
        setTimeout(() => {
          if (this.state !== 'SLEEPY') this.eyes.blink.target = 1;
        }, 110);
      }

      lifeLoop() {
        if (this.state === 'IDLE' && Math.random() > 0.4) {
          if (Math.random() > 0.6) {
            this.triggerBlink();
            if (Math.random() > 0.8) setTimeout(() => this.triggerBlink(), 180); 
          } else {
            this.eyes.gazeX.target = (Math.random() - 0.5) * 18;
            this.eyes.gazeY.target = (Math.random() - 0.5) * 12;
            setTimeout(() => {
              if (this.state === 'IDLE') {
                this.eyes.gazeX.target = 0;
                this.eyes.gazeY.target = 0;
              }
            }, 900 + Math.random() * 1000);
          }
        }
        setTimeout(() => this.lifeLoop(), 2200 + Math.random() * 3000);
      }

      breathingLoop() {
        if (this.state === 'IDLE') {
          this.eyes.bloom.target = this.eyes.bloom.target > 1.0 ? 0.88 : 1.12;
        }
        setTimeout(() => this.breathingLoop(), 1900);
      }

      reactToTouch(x, y) {
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2;
        this.eyes.gazeX.target = Math.max(-50, Math.min(50, (x - cx) * 0.12));
        this.eyes.gazeY.target = Math.max(-35, Math.min(35, (y - cy) * 0.12));
        this.eyes.bloom.target = 1.45;
        this.triggerBlink();
        
        clearTimeout(this.resetTimer);
        this.resetTimer = setTimeout(() => this.setState('IDLE'), 1400);
      }
    }

    const App = {
      init() {
        const canvas = document.getElementById('dabsy-canvas');
        this.eyes = new DabsyEyes(canvas);
        this.behavior = new DabsyBehavior(this.eyes);
        
        this.isMenuOpen = false;
        this.lastTap = 0;
        this.tapTimer = null;

        this.setupInteractions();
        this.loop();
        
        this.eyes.blink.val = 0.05;
        setTimeout(() => {
          this.eyes.blink.target = 1;
          this.speak("...you're back. 👀");
        }, 900);
      },

      setupInteractions() {
        const canvas = document.getElementById('dabsy-canvas');
        
        canvas.addEventListener('pointerup', (e) => {
          e.preventDefault();
          const now = Date.now();
          
          if (now - this.lastTap < 380) {
            clearTimeout(this.tapTimer);
            this.toggleMenu();
            this.lastTap = 0; 
          } else {
            this.lastTap = now;
            this.tapTimer = setTimeout(() => {
              if (!this.isMenuOpen) {
                this.behavior.reactToTouch(e.clientX, e.clientY);
              }
            }, 300);
          }
        });
      },

      toggleMenu() {
        this.isMenuOpen = !this.isMenuOpen;
        const menu = document.getElementById('bubble-menu');
        
        if (this.isMenuOpen) {
          menu.classList.add('active');
          this.behavior.setState('HAPPY');
          this.speak("What are we focusing on?");
        } else {
          menu.classList.remove('active');
          this.behavior.setState('IDLE');
        }
      },

      selectOption(optionName) {
        this.toggleMenu();
        this.speak(`Opening ${optionName}...`);
      },

      speak(text) {
        const sub = document.getElementById('subtitle-box');
        sub.innerText = text;
        sub.classList.add('visible');
        this.eyes.bloom.target = 1.5;
        setTimeout(() => {
          sub.classList.remove('visible');
          this.eyes.bloom.target = 1.0;
        }, 3200);
      },

      loop() {
        this.eyes.render();
        requestAnimationFrame(() => this.loop());
      }
    };

    window.addEventListener('load', () => App.init());
  </script>
</body>
</html>
